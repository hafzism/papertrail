services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: papertrail
      POSTGRES_PASSWORD: papertrail-test-only
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d papertrail"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

